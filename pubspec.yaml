name: record_app
description: 记录应用 - 提供安全、可靠的性同意证明
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=2.19.0-146.2.beta <3.0.0"
  flutter: ">=3.4.0-17.2.pre <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  get: ^4.6.1
  get_storage: ^2.0.3
  
  # 数据存储
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^5.0.2
  path_provider: ^2.0.11
  
  # 功能插件
  flutter_blue_plus: ^1.3.1
  camera: ^0.9.8+1
  flutter_sound: ^9.2.13
  google_ml_kit: ^0.7.3
  location: ^4.4.0
  permission_handler: ^10.2.0
  url_launcher: ^6.1.7
  share_plus: ^4.5.3
  
  # 工具
  crypto: ^3.0.2
  encrypt: ^5.0.1
  uuid: ^3.0.7
  intl: ^0.17.0
  logger: ^1.1.0
  device_info_plus: ^4.1.3
  package_info_plus: ^1.4.3+1
  
  # UI组件
  flutter_spinkit: ^5.1.0
  qr_flutter: ^4.0.0
  mobile_scanner: ^2.1.0
  lottie: ^1.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^1.0.0
  hive_generator: ^1.1.3
  build_runner: ^2.3.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/animations/
    
  fonts:
    - family: PingFang
      fonts:
        - asset: assets/fonts/PingFang-Regular.ttf
        - asset: assets/fonts/PingFang-Medium.ttf
          weight: 500
        - asset: assets/fonts/PingFang-Bold.ttf
          weight: 700 